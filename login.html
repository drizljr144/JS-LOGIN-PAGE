<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="heading">
      <h2>Login Here</h2>
    </div>
    <div class="fields">
      <label for="Fname">First name</label>
      <input type="text" placeholder="Your First Name" id="Fname" name="fname"><br><br>

      <label for="Lname">Last name</label>
      <input type="text" placeholder="Your Last Name" id="Lname" name="lname"><br><br>

      <label for="Password">Password</label>
      <input type="password" placeholder="Your Password" id="Password" name="password"><br><br>

      <label for="ConfirmPassword">Confirm Password</label>
      <input type="password" placeholder="Confirm your Password" id="ConfirmPassword" name="confirmPassword"><br><br>
    </div>
    <div class="submit">
      <button id="SubmitButton" onclick="RedirectFacebook()">Submit</button>
    </div>
  </div>

  <script src="index.js">
  </script>
</body>
</html>
