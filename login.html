<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="assets/fontawesome-free-7.2.0-web/fontawesome-free-7.2.0-web/css/all.min.css">
  <link rel="stylesheet" href="assets/fontawesome-free-7.2.0-web/fontawesome-free-7.2.0-web/css/brands.min.css">
  <link rel="stylesheet" href="assets/fontawesome-free-7.2.0-web/fontawesome-free-7.2.0-web/css/brands.css">
</head>
<body>
  <div class="icon">
    <i class="fa-brands fa-facebook"></i>
  </div>
  <div class="container">
    <div class="fields">

      <input type="text" placeholder="Mobile number or email" id="Username" name="Mobile number or email"><br>
  
      <input type="password" placeholder="Password" id="Password" name="password"><br>

    </div>
    <div class="submit">
      <button id="SubmitButton" onclick="RedirectFacebook()">Submit</button>
    </div>
    <div class="forgot">
      <a href="forgot.html"><button id="ForgotButton">Forgot password?</button></a>
    </div>
  </div>

  <script src="index.js">
  </script>
</body>
</html>
